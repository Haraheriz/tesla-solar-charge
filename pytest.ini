[pytest]
# poc/ にも test_*.py があるが、あれは実APIを叩く手動確認用スクリプトであり
# 自動テストではない。収集対象を tests/ に限定しないとCIで実通信を試みてしまう。
testpaths = tests

# 各テストは仮想時間で動くため実時間では一瞬で終わる。数秒でも掛かっているなら
# 「仮想時計に載せ損ねてどこかで本当にブロックしている」ことを意味する。
# 実際、main() の初回認証フロー（HTTPServerでコールバックを待つ）に入り込んで
# CIが12分ハングした事例があるため、上限を設けて失敗として検出する。
timeout = 60

addopts = -v --strict-markers
