name: Claude Code Review

# pull_request ではなく pull_request_target で起動する。
#
# pull_request は PR 側のワークフローファイルで動く。anthropics/claude-code-action は
# OIDC トークンの workflow_ref をデフォルトブランチと照合し、一致しなければ
# 「workflow validation」でスキップするため、このファイルを変更する PR はレビューされなかった。
# pull_request_target はデフォルトブランチ（main）のワークフローファイルで動くので照合を通り、
# このファイルを変更する PR も main 時点の設定でレビューされる。変更後の設定が効くのは
# マージ後の次の PR からであり、PR が自分をレビューする設定を書き換えられない点は保たれる。
#
# pull_request_target は base リポジトリの secrets を持って動く。そのため
#   1. 同一リポジトリのブランチからの PR に限る（fork からの PR では動かさない）
#   2. 作業ディレクトリ（ルート）には main を置き、PR の head は pr-head/ に別に取り出す
#   3. head の checkout に認証情報を残さない（persist-credentials: false）
# の3点を守る。アクション側の docs/security.md が示す構成と同じである。
# tests.yml は PR のコードを実行するため、この方式にしない（pull_request のまま）。
on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review]

jobs:
  claude-review:
    # Draft PR はスキップ（ready_for_review で改めて発火する）。
    # fork からの PR もスキップする（secrets を持つ実行を同一リポジトリのブランチに限る）。
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout base branch
        # ref を指定しないので main（PR の base）が作業ディレクトリになる
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Checkout pull request head into pr-head/
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code review
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            この PR をレビューしてください。

            ファイルの置き場所: 作業ディレクトリ（ルート）は main の内容であり、PR の変更後の
            ファイルは pr-head/ 以下にある。差分は gh pr diff で取得する。変更後のコードを読むときは
            pr-head/ を、変更前と比べるときはルートを読む。

            観点:
            - 正しさ: バグ、エッジケース、エラーハンドリングの欠落
            - セキュリティ: 認証情報・トークン・秘密鍵の漏出（このリポジトリは
              Tesla API のトークンや証明書を扱うため特に注意）
            - Tesla API / Nature Remo API の使い方の妥当性
            - 既存コードとの一貫性

            差分の外にあるファイルも Read / Glob / Grep で読めます。変更行だけを見て
            判断せず、呼び出し元・呼び出し先・関連するテスト・docs/ の記述まで
            確認したうえで指摘してください。「diff範囲外なので確認していない」で
            済ませないこと。設計の意図は docs/ と AGENTS.md に書かれています。

            テストの実行はこのジョブの役目ではありません。同じ PR に対して
            tests.yml が python -m pytest を実行します。テストを走らせようとせず、
            「実行できなかった」という但し書きも不要です。読解で確かめられることに
            集中し、テストコード自体の妥当性（旧挙動を仕様として固定していないか、
            検出力が足りているか）は積極的に見てください。

            指摘は日本語で、重要度の高い順に。
            行単位の指摘は mcp__github_inline_comment__create_inline_comment で、
            総評は mcp__github_comment__update_claude_comment で投稿してください。
            問題がなければ総評に簡潔な承認コメントだけを書いてください。
          # Read / Glob / Grep は読み取り専用で、コードを実行しない。差分の外を
          # 読めるようにするのが目的である（呼び出し元、既存のテスト、docs/ の記述）。
          # テストの実行（pytest）は意図的に許可していない。このリポジトリは公開で
          # あり、pytest はリポジトリ内の任意のコードを実行するため。テストは
          # tests.yml が同じ PR に対して実行する。
          # --add-dir pr-head で、PR の head を取り出したディレクトリも Read / Glob / Grep の対象にする。
          claude_args: '--add-dir pr-head --allowed-tools "mcp__github_comment__update_claude_comment,mcp__github_inline_comment__create_inline_comment,Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*)"'
