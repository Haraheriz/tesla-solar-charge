# 依存の版を更新する PR を Dependabot が出す。固定している版は次の2か所にある。
#   .github/workflows/*.yml の uses:（コミットSHA。行末コメントの版も併せて更新される）
#   requirements-dev.txt（== で固定）
# PR には tests.yml が走る。claude-review.yml の `uses:` を更新する PR は、
# ワークフローファイルの変更に当たるため自動レビューは実行されない（AGENTS.md）。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
