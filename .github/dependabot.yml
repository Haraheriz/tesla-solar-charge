# 依存の版を更新する PR を Dependabot が出す。固定している版は次の2か所にある。
#   .github/workflows/*.yml の uses:（コミットSHA。行末コメントの版も併せて更新される）
#   requirements-dev.txt（== で固定）
# PR には tests.yml が走る。claude-review.yml（自動レビュー）は、Dependabot が作成した PR では
# 実行しない（ジョブの if: 条件）。PR の本文に上流パッケージのリリースノートが入るため、
# secrets を持つジョブでレビュー役の AI に読ませない。変更内容は人が確認する（AGENTS.md）。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
