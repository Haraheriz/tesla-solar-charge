# tesla-override.service（操作サーバー）の権限を絞る（2026-11-20 の脆弱性検査 V-01、docs/06_security_hardening.md 2.6）。
# 配置先：/etc/systemd/system/tesla-override.service.d/10-hardening.conf
# <username> は実際のユーザー名に置き換えて配置する（ユニットファイルと同じ）。%h はシステムのサービスでは root のホームになるため使わない。
# このファイルを消して daemon-reload と再起動をすれば、元の設定に戻る。

[Service]
# sudo などで権限を上げられないようにする（setuid の実行を無効にする）
NoNewPrivileges=yes
CapabilityBoundingSet=
RestrictSUIDSGID=yes

# ファイルシステム：OS 全体とホームを読み取り専用にし、state/ だけ書き込みを許す
# （ログ、override_state.json とそのロックファイル、一時ファイル）。
# コードとテンプレートは読み取り専用になり、充電制御のコードを書き換えられない
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=/home/<username>/tesla-solar-charge/state
PrivateTmp=yes
PrivateDevices=yes
# 操作サーバーは control_config.json だけを読む。全体の設定（Client Secret、Nature Remo の
# トークン）、車両トークン、鍵、~/.ssh は見えなくする
InaccessiblePaths=-/home/<username>/tesla-solar-charge/tesla_config.json -/home/<username>/tesla-solar-charge/tesla_tokens.json -/home/<username>/tesla-solar-charge/tesla_app_key.pem -/home/<username>/tesla-solar-charge/key.pem -/home/<username>/tesla-solar-charge/cert.pem -/home/<username>/.ssh

# カーネルとほかのプロセスへの操作を禁じる
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictNamespaces=yes
RestrictRealtime=yes
LockPersonality=yes
SystemCallArchitectures=native

# 通信：IPv4、IPv6、UNIX ソケット、名前解決で使う netlink だけを許す
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
UMask=0077
