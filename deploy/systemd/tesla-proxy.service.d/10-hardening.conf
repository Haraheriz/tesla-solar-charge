# tesla-proxy.service の権限を絞る（2026-11-20 の脆弱性検査 V-01、docs/06_security_hardening.md 2.6）。
# 配置先：/etc/systemd/system/tesla-proxy.service.d/10-hardening.conf
# <username> は実際のユーザー名に置き換えて配置する（ユニットファイルと同じ）。%h はシステムのサービスでは root のホームになるため使わない。
# このファイルを消して daemon-reload と再起動をすれば、元の設定に戻る。

[Service]
# sudo などで権限を上げられないようにする（setuid の実行を無効にする）
NoNewPrivileges=yes
CapabilityBoundingSet=
RestrictSUIDSGID=yes

# ファイルシステム：OS 全体とホームを読み取り専用にする。プロキシは何も書き込まない
ProtectSystem=strict
ProtectHome=read-only
PrivateTmp=yes
PrivateDevices=yes
# 車両トークンと設定ファイル（Client Secret ほか）はプロキシに不要なので見えなくする
InaccessiblePaths=-/home/<username>/tesla-solar-charge/tesla_tokens.json -/home/<username>/tesla-solar-charge/tesla_config.json

# カーネルとほかのプロセスへの操作を禁じる
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictNamespaces=yes
RestrictRealtime=yes
LockPersonality=yes
SystemCallArchitectures=native

# 通信：IPv4、IPv6、UNIX ソケット、名前解決で使う netlink だけを許す
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
UMask=0077
