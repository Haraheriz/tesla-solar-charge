# tesla-observer.service の権限を絞る（2026-11-20 の脆弱性検査 V-01、docs/06_security_hardening.md 2.6）。
# 配置先：/etc/systemd/system/tesla-observer.service.d/10-hardening.conf
# 内容は tesla-charger.service と同じ（同じトークンファイルを共有し、同じディレクトリに書き込む）。
# <username> は実際のユーザー名に置き換えて配置する（ユニットファイルと同じ）。%h はシステムのサービスでは root のホームになるため使わない。
# このファイルを消して daemon-reload と再起動をすれば、元の設定に戻る。

[Service]
NoNewPrivileges=yes
CapabilityBoundingSet=
RestrictSUIDSGID=yes

ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=/home/<username>/tesla-solar-charge
PrivateTmp=yes
PrivateDevices=yes
InaccessiblePaths=-/home/<username>/tesla-solar-charge/tesla_app_key.pem -/home/<username>/tesla-solar-charge/key.pem

ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictNamespaces=yes
RestrictRealtime=yes
LockPersonality=yes
SystemCallArchitectures=native

RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
UMask=0077
