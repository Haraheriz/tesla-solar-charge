# tesla-charger.service の権限を絞る（2026-11-20 の脆弱性検査 V-01、docs/06_security_hardening.md 2.6）。
# 配置先：/etc/systemd/system/tesla-charger.service.d/10-hardening.conf
# <username> は実際のユーザー名に置き換えて配置する（ユニットファイルと同じ）。%h はシステムのサービスでは root のホームになるため使わない。
# このファイルを消して daemon-reload と再起動をすれば、元の設定に戻る。

[Service]
# sudo などで権限を上げられないようにする（setuid の実行を無効にする）
NoNewPrivileges=yes
CapabilityBoundingSet=
RestrictSUIDSGID=yes

# ファイルシステム：OS 全体とホームを読み取り専用にし、プロジェクトのディレクトリだけ書き込みを許す
# （ログ、トークンの更新、状態ファイル、ロックファイル）
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=/home/<username>/tesla-solar-charge
PrivateTmp=yes
PrivateDevices=yes
# 車両コマンドの署名鍵と HTTPS の秘密鍵はプロキシだけが使い、control_config.json（CONTROL_TOKEN）は操作サーバーだけが使うので見えなくする
InaccessiblePaths=-/home/<username>/tesla-solar-charge/tesla_app_key.pem -/home/<username>/tesla-solar-charge/key.pem -/home/<username>/tesla-solar-charge/control_config.json

# カーネルとほかのプロセスへの操作を禁じる
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictNamespaces=yes
RestrictRealtime=yes
LockPersonality=yes
SystemCallArchitectures=native

# 通信：IPv4、IPv6、UNIX ソケット、名前解決で使う netlink だけを許す
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
UMask=0077
